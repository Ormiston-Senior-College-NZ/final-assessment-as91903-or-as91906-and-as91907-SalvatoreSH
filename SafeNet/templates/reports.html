{% extends "base.html" %}

{% block content %}

<h1>Community Scam Reports</h1>

{% if reports %}

    {% for report in reports %}

        <div class="card">

            <h3>{{ report.title }}</h3>

            <p>{{ report.description }}</p>

        </div>

    {% endfor %}

{% else %}

<p>No reports submitted yet.</p>

{% endif %}

{% endblock %}
