{% extends "base.html" %}

{% block content %}

<h1>Report Scam</h1>

<form method="POST">

    <input
        type="text"
        name="title"
        placeholder="Scam title"
        required>

    <textarea
        name="description"
        placeholder="Describe the scam"
        required></textarea>

    <button type="submit">
        Submit
    </button>

</form>

{% if success %}

<p style="color:green; font-weight:bold; margin-top:20px;">
    ✓ Report submitted successfully.
</p>

{% endif %}

{% endblock %}
